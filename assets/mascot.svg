<svg width="120" height="130" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a4468"/>
      <stop offset="100%" stop-color="#2b2740"/>
    </radialGradient>
  </defs>

  <!-- katana held at the side -->
  <g transform="rotate(20 92 95)">
    <rect x="89" y="60" width="4" height="46" rx="2" fill="#cfd6dc"/>
    <rect x="86" y="100" width="10" height="6" rx="2" fill="#5a4632"/>
    <rect x="80" y="104" width="22" height="5" rx="2.5" fill="#7a5c3e"/>
  </g>

  <!-- hair back -->
  <ellipse cx="55" cy="60" rx="34" ry="32" fill="url(#hairGrad)"/>

  <!-- face -->
  <ellipse cx="55" cy="66" rx="26" ry="24" fill="#ffe3d1"/>

  <!-- blush -->
  <ellipse cx="38" cy="74" rx="5" ry="3" fill="#ff9d9d" opacity="0.65"/>
  <ellipse cx="72" cy="74" rx="5" ry="3" fill="#ff9d9d" opacity="0.65"/>

  <!-- glowing red eyes, simple ring accent (generic, not tomoe) -->
  <g>
    <g>
      <circle cx="44" cy="66" r="6" fill="#d81e1e"/>
      <circle cx="44" cy="66" r="6" fill="none" stroke="#ffb3b3" stroke-width="1"/>
      <circle cx="44" cy="66" r="2" fill="#1a0000"/>
      <animate attributeName="opacity" values="1;1;1;0.05;1;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="66" cy="66" r="6" fill="#d81e1e"/>
      <circle cx="66" cy="66" r="6" fill="none" stroke="#ffb3b3" stroke-width="1"/>
      <circle cx="66" cy="66" r="2" fill="#1a0000"/>
      <animate attributeName="opacity" values="1;1;1;0.05;1;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- smile -->
  <path d="M 48 78 Q 55 83 62 78" stroke="#2b2740" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- hair front fringe -->
  <path d="M 22 54 Q 30 30 55 28 Q 80 30 88 54 Q 76 42 55 42 Q 34 42 22 54 Z" fill="url(#hairGrad)"/>

  <!-- straw sun-hat, generic shape, resting behind head on a cord -->
  <g>
    <ellipse cx="55" cy="20" rx="40" ry="9" fill="#e0b872" stroke="#c79a55" stroke-width="1.5"/>
    <ellipse cx="55" cy="16" rx="17" ry="10" fill="#e8c583" stroke="#c79a55" stroke-width="1.5"/>
    <rect x="40" y="20" width="30" height="4" rx="2" fill="#8b2e2e"/>
  </g>

  <!-- little idle bob -->
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="2.6s" repeatCount="indefinite"/>
</svg>
